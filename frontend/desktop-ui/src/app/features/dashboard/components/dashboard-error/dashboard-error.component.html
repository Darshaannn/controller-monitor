<div class="dashboard-error-card card p-4 text-center border-danger-subtle my-4" role="alert">
  <div class="error-icon-box mx-auto mb-3 d-flex align-items-center justify-content-center">
    <svg
      width="28"
      height="28"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="12" cy="12" r="10" />
      <line x1="12" y1="8" x2="12" y2="12" />
      <line x1="12" y1="16" x2="12.01" y2="16" />
    </svg>
  </div>
  <h2 class="h5 fw-bold text-danger mb-2">Telemetry Communication Failure</h2>
  <p class="text-muted mb-4 mx-auto max-w-500">{{ message() }}</p>
  <div>
    <button
      type="button"
      class="btn btn-primary px-4 py-2 fw-medium d-inline-flex align-items-center"
      (click)="onRetry()"
      aria-label="Retry connection to telemetry service"
    >
      <svg
        class="me-2"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
      </svg>
      Retry Connection
    </button>
  </div>
</div>
