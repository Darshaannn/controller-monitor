<div class="telemetry-card card h-100 shadow-sm border" [attr.data-metric]="model().key">
  <!-- Card Header -->
  <div
    class="card-header bg-transparent border-0 pt-3 px-3 pb-0 d-flex justify-content-between align-items-center"
  >
    <div class="d-flex align-items-center">
      <div
        class="metric-icon me-2 d-flex align-items-center justify-content-center p-1 overflow-hidden"
      >
        <img
          [src]="iconSrc()"
          [alt]="model().label + ' icon'"
          width="22"
          height="22"
          class="img-fluid"
        />
      </div>
      <div>
        <h2 class="card-title h6 mb-0 fw-bold">{{ model().label }}</h2>
        <span class="card-subtitle text-muted x-small">{{ model().description }}</span>
      </div>
    </div>
    <div class="d-flex align-items-center gap-2">
      <!-- Custom Polished Unit Selector Dropdown -->
      <div class="custom-unit-dropdown position-relative">
        <button
          type="button"
          class="btn btn-sm unit-pill-btn d-flex align-items-center gap-1"
          (click)="toggleDropdown()"
          [attr.aria-expanded]="isDropdownOpen()"
          [attr.aria-label]="model().label + ' Unit Selector'"
        >
          <span class="unit-pill-text">{{ model().displayUnit }}</span>
          <svg
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="chevron-icon"
            [class.rotated]="isDropdownOpen()"
          >
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        @if (isDropdownOpen()) {
          <div class="position-fixed top-0 start-0 w-100 h-100 z-1" (click)="closeDropdown()"></div>
          <div
            class="custom-unit-menu shadow-lg position-absolute z-2"
            style="top: 100%; right: 0; margin-top: 4px"
          >
            @for (u of model().supportedUnits; track u) {
              <button
                type="button"
                class="custom-unit-item d-flex align-items-center justify-content-between w-100"
                [class.active]="u === model().displayUnit"
                (click)="onUnitSelect(u)"
              >
                <span>{{ u }}</span>
                @if (u === model().displayUnit) {
                  <svg
                    width="13"
                    height="13"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                }
              </button>
            }
          </div>
        }
      </div>

      <app-status-badge [status]="model().status" />
    </div>
  </div>

  <!-- Primary Reading / Gauge Section -->
  <div class="card-body px-3 py-2 d-flex flex-column align-items-center justify-content-center">
    <app-circular-gauge
      [value]="model().displayValue"
      [min]="model().gaugeMin"
      [max]="model().gaugeMax"
      [unit]="model().displayUnit"
      [label]="model().label"
      [status]="model().status"
    />

    <!-- Baseline Comparison & Deviation -->
    <div class="metric-metadata mt-2 d-flex justify-content-between w-100 px-2 py-1 rounded">
      <div class="meta-item">
        <span class="meta-label d-block x-small">BASELINE</span>
        <span class="meta-value fw-semibold small"
          >{{ model().baseline }} {{ model().displayUnit }}</span
        >
      </div>
      <div class="meta-item text-end">
        <span class="meta-label d-block x-small">DEVIATION</span>
        <span
          class="meta-value fw-bold small"
          [ngClass]="{
            'text-success': model().status === 'normal',
            'text-warning': model().status === 'warning',
            'text-danger': model().status === 'critical',
          }"
        >
          {{ formattedDeviation() }}
        </span>
      </div>
    </div>

    <!-- Live Interactive Chart.js Graph Component -->
    <app-telemetry-chart
      [metricKey]="model().key"
      [history]="model().history"
      [unit]="model().displayUnit"
      [label]="model().label"
    />
  </div>

  <!-- Card Footer -->
  <div
    class="card-footer bg-transparent border-top py-2 px-3 d-flex justify-content-between align-items-center"
  >
    <span class="text-muted x-small">
      Samples: <strong class="text-dark">{{ model().history.length }}</strong>
    </span>
    <span class="text-muted x-small"> Updated: {{ model().lastUpdated }} </span>
  </div>
</div>
