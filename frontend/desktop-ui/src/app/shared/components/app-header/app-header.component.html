<header
  class="app-header d-flex justify-content-between align-items-center px-4 py-3 border-bottom"
>
  <!-- Brand & Identity -->
  <div class="d-flex align-items-center">
    <div class="brand-logo-container me-3 d-flex align-items-center justify-content-center">
      <img
        src="assets/icons/app-logo.png"
        alt="Controller Monitor Logo"
        height="42"
        class="brand-logo-img"
      />
    </div>
    <div>
      <h1 class="brand-title h5 mb-0 fw-bold">Controller Monitor</h1>
      <span class="brand-subtitle text-muted small">Real-Time Telemetry Dashboard</span>
    </div>
  </div>

  <!-- Actions, Status & Theme Area -->
  <div class="header-actions d-flex align-items-center gap-3">
    <!-- Live Export Feedback Toast/Badge -->
    @if (statusMessage()) {
      <div
        class="badge px-2 px-sm-3 py-1 py-sm-2 animate-fade-in text-truncate"
        style="max-width: 140px"
        [ngClass]="{
          'bg-success-subtle text-success border border-success': exportStatus() === 'success',
          'bg-warning-subtle text-warning border border-warning':
            exportStatus() === 'cancelled' || exportStatus() === 'empty',
          'bg-danger-subtle text-danger border border-danger': exportStatus() === 'error',
          'bg-info-subtle text-info border border-info': exportStatus() === 'exporting',
        }"
      >
        {{ statusMessage() }}
      </div>
    }

    <!-- Export Action Dropdown -->
    <div class="dropdown position-relative">
      <button
        class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 gap-sm-2 px-2 px-sm-3 py-1 dropdown-toggle"
        type="button"
        (click)="toggleDropdown()"
        [attr.aria-expanded]="isDropdownOpen()"
        id="exportDropdownBtn"
        aria-label="Export Telemetry Data"
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        <span class="d-none d-sm-inline">Export</span>
      </button>

      @if (isDropdownOpen()) {
        <!-- Backdrop to close dropdown on click outside -->
        <div class="position-fixed top-0 start-0 w-100 h-100 z-1" (click)="closeDropdown()"></div>
        <ul
          class="dropdown-menu dropdown-menu-end shadow show position-absolute z-2"
          style="top: 100%; right: 0; min-width: 190px"
          aria-labelledby="exportDropdownBtn"
        >
          <li>
            <button
              class="dropdown-item d-flex align-items-center gap-2 py-2"
              type="button"
              (click)="exportCsv()"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="16" y1="13" x2="8" y2="13" />
                <line x1="16" y1="17" x2="8" y2="17" />
                <polyline points="10 9 9 9 8 9" />
              </svg>
              <span>Export as CSV</span>
            </button>
          </li>
          <li>
            <button
              class="dropdown-item d-flex align-items-center gap-2 py-2"
              type="button"
              (click)="exportExcel()"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <line x1="3" y1="9" x2="21" y2="9" />
                <line x1="9" y1="21" x2="9" y2="9" />
              </svg>
              <span>Export as Excel (.xlsx)</span>
            </button>
          </li>
        </ul>
      }
    </div>

    <!-- Light / Dark Mode Toggle Button -->
    <button
      class="btn btn-sm btn-outline-secondary theme-toggle-btn d-flex align-items-center justify-content-center"
      type="button"
      (click)="toggleTheme()"
      [attr.aria-label]="
        themeService.currentTheme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'
      "
      [title]="
        themeService.currentTheme() === 'dark' ? 'Switch to Light Theme' : 'Switch to Dark Theme'
      "
    >
      @if (themeService.currentTheme() === 'dark') {
        <!-- Sun icon for switching to light mode -->
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
      } @else {
        <!-- Moon icon for switching to dark mode -->
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      }
    </button>

    @if (lastUpdated()) {
      <div class="timestamp-display text-end d-none d-sm-block">
        <div class="text-muted-subtle x-small text-uppercase">Last Received</div>
        <div class="timestamp-value fw-medium small">{{ lastUpdated() }}</div>
      </div>
    }

    <app-connection-indicator [state]="connectionState()" [endpoint]="apiEndpoint()" />
  </div>
</header>
