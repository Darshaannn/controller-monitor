<div
  class="circular-gauge-container position-relative d-flex justify-content-center align-items-center"
  role="meter"
  [attr.aria-label]="label()"
  [attr.aria-valuenow]="value()"
  [attr.aria-valuemin]="min()"
  [attr.aria-valuemax]="max()"
  [attr.aria-valuetext]="formattedValue() + ' ' + unit() + ' (' + status() + ')'"
>
  <svg
    class="gauge-svg"
    [attr.width]="size"
    [attr.height]="size"
    [attr.viewBox]="'0 0 ' + size + ' ' + size"
  >
    <!-- Background Track (270 degree arc) -->
    <circle
      class="gauge-track"
      [attr.cx]="center"
      [attr.cy]="center"
      [attr.r]="radius"
      [attr.stroke-width]="strokeWidth"
      [attr.stroke-dasharray]="arcLength() + ' ' + circumference"
      stroke-dashoffset="0"
      [attr.transform]="'rotate(135, ' + center + ', ' + center + ')'"
    />

    <!-- Foreground Progress Arc -->
    <circle
      class="gauge-fill"
      [ngClass]="statusColorClass()"
      [attr.cx]="center"
      [attr.cy]="center"
      [attr.r]="radius"
      [attr.stroke-width]="strokeWidth"
      [attr.stroke-dasharray]="arcLength() + ' ' + circumference"
      [attr.stroke-dashoffset]="arcOffset()"
      stroke-linecap="round"
      [attr.transform]="'rotate(135, ' + center + ', ' + center + ')'"
    />
  </svg>

  <!-- Gauge Center Reading -->
  <div
    class="gauge-content position-absolute text-center d-flex flex-column justify-content-center align-items-center"
  >
    <div class="gauge-value fw-bold lh-1 text-truncate">
      {{ formattedValue() }}
    </div>
    <div class="gauge-unit text-muted small mt-1 fw-semibold">
      {{ unit() }}
    </div>
    <div class="gauge-range text-muted-subtle x-small mt-2">{{ min() }} - {{ max() }}</div>
  </div>
</div>
