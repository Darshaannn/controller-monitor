<div class="connection-indicator d-flex align-items-center" [ngClass]="statusClass()">
  <span class="indicator-dot me-2 rounded-circle" aria-hidden="true"></span>
  <div class="d-flex flex-column text-end">
    <span class="indicator-text fw-semibold">{{ statusLabel() }}</span>
    @if (endpoint()) {
      <span class="indicator-endpoint text-muted text-truncate" title="{{ endpoint() }}">{{
        endpoint()
      }}</span>
    }
  </div>
</div>
